name: AsymptaWorld
options:
  bundleIdPrefix: com.asympta
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3P7YJW4D3Z
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  AsymptaWorld:
    type: application
    platform: iOS
    sources:
      - path: AsymptaWorld
        excludes:
          - Web
          - Art
      - path: AsymptaWorld/Art
        type: folder
        buildPhase: resources
    info:
      path: AsymptaWorld/Info.plist
      properties:
        CFBundleDisplayName: Asympta World
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleLocalizations: [en, zh-Hant, ja]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: '$(PRODUCT_MODULE_NAME).SceneDelegate'
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asympta.world
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
schemes:
  AsymptaWorld:
    build:
      targets:
        AsymptaWorld: all
    run:
      config: Debug
    archive:
      config: Release
