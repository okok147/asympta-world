name: Kernel unification verification
on:
  push:
    branches: [kernel-unification-20260907]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/asympta-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: asympta-source
          path: /tmp/asympta-source.tar
          retention-days: 1
