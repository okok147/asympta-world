name: Kernel unification verification
on:
  push:
    branches: [kernel-unification-20260907]
    paths: ['.github/kernel-patch/**', '.github/workflows/kernel-unification-check.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_ASYMPTA_AGENT_API_URL: https://asympta-public-intent-agent.asympta-invitation-service.workers.dev
      NEXT_PUBLIC_ASYMPTA_TURNSTILE_SITE_KEY: 0x4AAAAAAEiD_1SGxiCjdi1o
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed implementation
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib
          data=''.join(p.read_text() for p in sorted(pathlib.Path('.github/kernel-patch').glob('part-*')))
          patch=lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='0e0fad25b138df52c5ae092c3fa640fb3ed07696a594e1803dca91c97c28a672'
          pathlib.Path('/tmp/coordination.patch').write_bytes(patch)
          PY
          git apply --check /tmp/coordination.patch
          git apply /tmp/coordination.patch
          mkdir -p /tmp/kernel-validation
      - name: Install
        run: npm ci
      - name: Lint and full typecheck
        run: |
          npm run lint 2>&1 | tee /tmp/kernel-validation/lint.log
          npm run typecheck 2>&1 | tee /tmp/kernel-validation/typecheck.log
      - name: Engine and public agent regression
        run: |
          npm run test:engine 2>&1 | tee /tmp/kernel-validation/engine.log
          npm run test:public-agent 2>&1 | tee /tmp/kernel-validation/public-agent.log
      - name: Build
        run: npm run build 2>&1 | tee /tmp/kernel-validation/build.log
      - name: Rendered product
        run: npm run test:rendered 2>&1 | tee /tmp/kernel-validation/rendered.log
      - name: Export Pages
        run: npm run export:pages 2>&1 | tee /tmp/kernel-validation/export.log
      - name: Browser kernel, approval and languages
        run: node scripts/smoke-coordination-kernel-browser.mjs 2>&1 | tee /tmp/kernel-validation/browser-kernel.log
      - name: Existing browser regressions
        run: |
          node scripts/smoke-pages-browser.mjs
          node scripts/smoke-business-mode-browser.mjs
          node scripts/smoke-business-locale-browser.mjs
          node scripts/smoke-buy-food-browser.mjs
          node scripts/smoke-buy-car-browser.mjs
          node scripts/verify-universal-browser.mjs
      - name: Commit verified implementation only to isolation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml components/asympta-simulation-workspace.tsx docs/SHARED_COORDINATION_KERNEL.md lib/asympta-coordination-kernel.ts lib/asympta-simulation-compiler.ts lib/asympta-simulation-coordination.ts lib/asympta-simulation-copy.ts lib/atlas-canonical-world.ts lib/atlas-simulation.ts package.json scripts/smoke-coordination-kernel-browser.mjs tests/coordination-kernel.test.mjs
          git diff --cached --check
          git commit -m 'feat: verify shared intent action coordination kernel'
          git push origin HEAD:kernel-unification-20260907
          git rev-parse HEAD > /tmp/kernel-validation/commit.txt
          git ls-tree -r HEAD > /tmp/kernel-validation/tree.txt
      - name: Save validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-validation
          path: /tmp/kernel-validation
          retention-days: 2
