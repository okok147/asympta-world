name: Kernel v2 one-shot patch

on:
  push:
    branches:
      - kernel/canonical-semantic-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: kernel/canonical-semantic-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply semantic kernel integration
        run: node scripts/apply-kernel-v2.mjs
      - name: Validate structural kernel leap
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run test:public-agent
          npm run build
          npm run test:rendered
      - name: Commit only validated kernel changes
        run: |
          rm scripts/apply-kernel-v2.mjs
          rm .github/workflows/kernel-v2-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/asympta-semantic-kernel.ts lib/asympta-task-kernel-types.ts lib/asympta-task-kernel-core-impl.ts lib/asympta-task-policy.ts lib/asympta-requirement-contracts.ts tests/universal-benchmark.test.mjs scripts/apply-kernel-v2.mjs .github/workflows/kernel-v2-one-shot.yml
          git commit -m "feat: add canonical semantic kernel v2"
          git push origin HEAD:kernel/canonical-semantic-v2

# One-shot validation worker; removed from the feature branch after a green run.
