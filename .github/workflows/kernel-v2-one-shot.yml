name: Kernel v2 one-shot patch

on:
  push:
    branches:
      - kernel/canonical-semantic-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: kernel/canonical-semantic-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compile repair
        run: node scripts/patch-holdout-compile.mjs
      - name: Validate benchmark compiles
        run: |
          npm run typecheck
          npm run test:engine
      - name: Commit validated repair
        run: |
          rm scripts/patch-holdout-compile.mjs
          rm .github/workflows/kernel-v2-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/asympta-kernel-holdout-benchmark.ts scripts/patch-holdout-compile.mjs .github/workflows/kernel-v2-one-shot.yml
          git commit -m "test: repair semantic holdout harness"
          git push origin HEAD:kernel/canonical-semantic-v2
