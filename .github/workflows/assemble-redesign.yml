name: Assemble validated Asympta redesign

on:
  push:
    branches:
      - redesign-assemble-20260828
    paths:
      - .redesign/READY

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign-assemble-20260828
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Assemble redesign source
        shell: bash
        run: |
          set -euo pipefail
          cat .redesign/lib__living-world__types_ts__*.part > lib/living-world/types.ts
          cat .redesign/lib__living-world__scenarios_ts__*.part > lib/living-world/scenarios.ts
          cat .redesign/components__asympta-world-experience_tsx__*.part > components/asympta-world-experience.tsx
          cat .redesign/app__asympta-restoration_css__*.part > app/asympta-restoration.css
          cat .redesign/tests__living-world-engine_test_mjs__*.part > tests/living-world-engine.test.mjs
          cat .redesign/tests__living-world-product_test_mjs__*.part > tests/living-world-product.test.mjs
          cat .redesign/tests__rendered-html_test_mjs__*.part > tests/rendered-html.test.mjs
          cat .redesign/app__page_tsx__*.part > app/page.tsx
          cat .redesign/app__layout_tsx__*.part > app/layout.tsx
          cat .redesign/components__living-world__living-world-app_tsx__*.part > components/living-world/living-world-app.tsx
          cat .redesign/README_md__*.part > README.md

          python - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path

          req = urllib.request.Request(
              'https://api.github.com/repos/okok147/asympta-world/git/blobs/fa05ba50a550a0063cec003f058080f852448df9',
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'asympta-redesign-assembler'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          Path('lib/living-world/engine.ts').write_bytes(base64.b64decode(payload['content']))

          agents = Path('AGENTS.md')
          current = agents.read_text()
          banner = '''# CURRENT MAIN PRODUCT STATE — 2026-08-28\n\nThe calm multi-party Asympta World redesign is now the source of truth. Do not restore the rough WebMCP demo/dashboard visual language. Preserve the paper-like Asympta aesthetic, one-world stakeholder process, deterministic event engine, WebMCP truthfulness, human approval boundaries, responsive design and reduced-motion support.\n\n---\n\n'''
          if not current.startswith('# CURRENT MAIN PRODUCT STATE'):
              agents.write_text(banner + current.replace('Status: **PENDING HOME CODEX ACKNOWLEDGEMENT**', 'Status: **IMPLEMENTED ON MAIN — 2026-08-28**'))
          PY

          rm -f HOME_CODEX_ACKNOWLEDGEMENT.md
          rm -rf .redesign
          rm -f .github/workflows/assemble-redesign.yml

      - name: Install
        run: npm ci

      - name: Validate complete product
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run build
          npm run test:rendered
          npm run export:pages

      - name: Commit validated redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OK"
          git config user.email "38970774+okok147@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore calm multi-party Asympta World"
          git push origin HEAD:redesign-assemble-20260828
