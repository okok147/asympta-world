name: Autofix task process lint

on:
  push:
    branches:
      - feat/task-process-inventory
    paths:
      - .github/workflows/autofix-task-process.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/task-process-inventory

      - name: Apply focused lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/task-process-runtime.tsx")
          source = path.read_text()
          source = source.replace(
              "        let recentDelta = record.recentDelta;\n        let awardedSubtaskIds = [...record.awardedSubtaskIds];",
              "        let recentDelta = record.recentDelta;\n        if (recentDelta && recentDelta.until < now) recentDelta = undefined;\n        const awardedSubtaskIds = [...record.awardedSubtaskIds];",
          )
          source = source.replace(
              "  const recentDelta =\n    activeRecord?.recentDelta && activeRecord.recentDelta.until >= Date.now()\n      ? activeRecord.recentDelta.label\n      : undefined;",
              "  const recentDelta = activeRecord?.recentDelta?.label;",
          )
          path.write_text(source)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/task-process-runtime.tsx
          git commit -m "Fix task process lint and expiry handling"
          git push origin HEAD:feat/task-process-inventory
