name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Vendor map runtime for Pages
        run: |
          set -euo pipefail
          mkdir -p public/vendor
          curl --fail --location --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 90 \
            https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js \
            -o public/vendor/maplibre-gl.js
          curl --fail --location --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 90 \
            https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css \
            -o public/vendor/maplibre-gl.css
          curl --fail --location --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 90 \
            https://tiles.openfreemap.org/styles/positron \
            -o public/vendor/openfreemap-positron.json
          test -s public/vendor/maplibre-gl.js
          test -s public/vendor/maplibre-gl.css
          test -s public/vendor/openfreemap-positron.json

      - name: Validate product and engine invariants
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine

      - name: Build
        run: npm run build

      - name: Validate rendered product
        run: npm run test:rendered

      - name: Export static Pages site
        run: npm run export:pages

      - name: Verify vendored map assets
        run: |
          test -s pages-dist/vendor/maplibre-gl.js
          test -s pages-dist/vendor/maplibre-gl.css
          test -s pages-dist/vendor/openfreemap-positron.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
