name: Deploy GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate paper-only experience and preserved coordination engine
        run: |
          npm run lint
          npm run typecheck
          node --test tests/paper-world-source.test.mjs
          node --experimental-loader ./scripts/cloudflare-node-loader.mjs --test tests/coordination-kernel.test.mjs

      - name: Build
        run: npm run build

      - name: Validate rendered paper and dots
        run: npm run test:rendered

      - name: Export static Pages site
        run: npm run export:pages

      - name: Validate real browser rendering and CSS movement
        run: node scripts/smoke-paper-world-browser.mjs

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
