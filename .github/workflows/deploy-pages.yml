name: Deploy GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ASYMPTA_AGENT_API_URL: https://asympta-public-intent-agent.asympta-invitation-service.workers.dev
      NEXT_PUBLIC_ASYMPTA_TURNSTILE_SITE_KEY: 0x4AAAAAAEiD_1SGxiCjdi1o
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate product and engine invariants
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run test:public-agent

      - name: Build
        run: npm run build

      - name: Validate rendered product
        run: npm run test:rendered

      - name: Export static Pages site
        run: npm run export:pages

      - name: Validate browser hydration
        run: node scripts/smoke-pages-browser.mjs

      - name: Validate Buy some food through delivery and celebration
        run: node scripts/smoke-buy-food-browser.mjs

      - name: Validate 100 real-life cases and stress mutations in browser
        run: node scripts/verify-universal-browser.mjs

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
