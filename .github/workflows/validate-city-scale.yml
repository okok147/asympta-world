name: Validate city-scale Asympta

on:
  push:
    branches:
      - city-scale-original-ref-20260828

permissions:
  contents: write

jobs:
  validate-city-scale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical city-scale movement patch
        run: node scripts/apply-city-scale-patch.mjs

      - name: Fix city UI runtime API
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "components/asympta-world-experience.tsx";
          let source = await readFile(path, "utf8");
          source = source.replaceAll("runtime.chooseAction(", "runtime.choose(");
          source = source.replaceAll("runtime.resolveApproval(", "runtime.approve(");
          const oldEffect = 'useEffect(() => { const demo = new URLSearchParams(window.location.search).get("demo"); if (demo === "order") runtime.runScenario("order"); /* eslint-disable-next-line react-hooks/exhaustive-deps */ }, []);';
          const newEffect = 'const runScenario = runtime.runScenario;\n  useEffect(() => { const demo = new URLSearchParams(window.location.search).get("demo"); if (demo === "order") runScenario("order"); }, [runScenario]);';
          if (!source.includes(oldEffect)) throw new Error("city demo effect marker missing");
          source = source.replace(oldEffect, newEffect);
          await writeFile(path, source);
          NODE

      - name: Install
        run: npm ci

      - name: Validate city-scale product
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run build
          npm run test:rendered
          npm run export:pages

      - name: Commit validated city choreography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/asympta-world-experience.tsx lib/living-world/engine.ts lib/living-world/scenarios.ts
          if git diff --cached --quiet; then
            echo "No validated patch changes to commit"
          else
            git commit -m "feat: route agents through the city economy"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
