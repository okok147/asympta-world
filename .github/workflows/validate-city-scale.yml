name: Validate city-scale Asympta

on:
  push:
    branches:
      - city-scale-original-ref-20260828

permissions:
  contents: write

jobs:
  validate-city-scale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical city-scale movement patch
        run: node scripts/apply-city-scale-patch.mjs

      - name: Install
        run: npm ci

      - name: Validate city-scale product
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run build
          npm run test:rendered
          npm run export:pages

      - name: Commit validated engine choreography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/living-world/engine.ts lib/living-world/scenarios.ts
          if git diff --cached --quiet; then
            echo "No engine patch changes to commit"
          else
            git commit -m "feat: route agents through the city economy"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
