name: Apply structural Task Kernel fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-kernel-fix.mjs
      - .github/workflows/kernel-fix-apply.yml

permissions:
  contents: write

concurrency:
  group: kernel-structural-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Repair one-off patch runner quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-kernel-fix.mjs")
          text = path.read_text()
          replacements = [
              ('return { value: amount, label: `${code} ${money[2]}` };', 'return { value: amount, label: code + " " + money[2] };'),
              ('if (match) return { value: `${match[1]}-inch`, label: `${match[1]}″` };', 'if (match) return { value: match[1] + "-inch", label: match[1] + "″" };'),
              (r'new RegExp(`\\b${candidate}\\b`, "iu")', r'new RegExp("\\b" + candidate + "\\b", "iu")'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"repair target missing: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          node --check scripts/apply-kernel-fix.mjs

      - name: Apply structural kernel patch
        run: node scripts/apply-kernel-fix.mjs

      - name: Validate structural patch
        run: |
          npm run lint
          npm run typecheck
          npm run test:engine
          npm run test:public-agent

      - name: Commit verified fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: harden Task Kernel semantic and safety invariants"
          git push origin HEAD:main
