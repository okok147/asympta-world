name: Materialize simulated city cloud debug branch

on:
  push:
    branches:
      - codex/simulated-city-cloud-20260830

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .automation/citypatch/part-00 \
            .automation/citypatch/part-01 \
            .automation/citypatch/part-02 \
            .automation/citypatch/part-03a \
            .automation/citypatch/part-03b0 \
            .automation/citypatch/part-03b1 \
            .automation/citypatch/part-03b2 \
            .automation/citypatch/part-03c \
            .automation/citypatch/part-04 \
            .automation/citypatch/part-05 \
            > /tmp/apply-city-cloud.py.gz.b64
          echo "68cd1fb99fd0b419eb33c9d9170e6a4169b0673c541f03d56793ad0b426c50d1  /tmp/apply-city-cloud.py.gz.b64" | sha256sum -c -
          base64 --decode /tmp/apply-city-cloud.py.gz.b64 > /tmp/apply-city-cloud.py.gz
          echo "64d83bcce861b70b655b41ac61ea350dde8c8f6cad0023f0cc834d178b1fbfbd  /tmp/apply-city-cloud.py.gz" | sha256sum -c -
          gzip -dc /tmp/apply-city-cloud.py.gz > /tmp/apply-city-cloud.py
          echo "6148b69c3fc4b4bdfe18177edf448ca58aeaca1101878bb212cf418080c36b09  /tmp/apply-city-cloud.py" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/apply-city-cloud.py")
          source = path.read_text()
          source = source.replace("if count != 1:", "if count < 1:", 1)
          path.write_text(source)
          PY
          python3 -m py_compile /tmp/apply-city-cloud.py

      - name: Apply and publish isolated debug snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B codex/simulated-city-cloud-debug origin/main
          python3 /tmp/apply-city-cloud.py
          git diff --check
          git config user.name "Asympta debug automation"
          git config user.email "everformlab@apple.com"
          git add app cloudflare components lib package.json scripts tests
          git commit -m "debug: materialize simulated city cloud implementation"
          git push --force-with-lease origin HEAD:codex/simulated-city-cloud-debug
